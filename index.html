<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN-T V2.0</title>
    <style>
        /* ===================================== */
        /*            General Styles             */
        /* ===================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        :root {
            --sidebar-width: 72px;
            --primary-gradient: linear-gradient(180deg, #3a3a3a, #3a3a3a);
            --secondary-gradient: linear-gradient(135deg, #000, #3a3a3a);
            --accent-color: #76B900;
            --hover-color: rgba(118, 185, 0, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --thinking-bg: #1a1a1a;
            --thinking-transition-duration: 0.3s;
            --thinking-button-height: 100px;
            --thinking-button-expanded-padding: 1.5rem;
            --voice-button-size: 60px;
            --accent-color-rgb: 118, 185, 0;
        }

        body {
            background: linear-gradient(180deg, #0a0a0a, #1a1a1a);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
            transition: filter 0.3s ease;
            overscroll-behavior: none; /* Prevent pull-to-refresh */
        }

        body.blur {
            filter: blur(5px);
        }

        /* ===================================== */
        /*               Sidebar                 */
        /* ===================================== */
        @media (min-width: 769px) {
            .sidebar {
                width: var(--sidebar-width);
                background: var(--secondary-gradient);
                padding: 1.5rem 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                border-right: 1px solid rgba(255, 255, 255, 0.1);
                position: fixed;
                height: 100vh;
                z-index: 100;
                transition: transform 0.3s ease-in-out;
                transform: translateX(0);
            }

            .main-content {
                margin-left: var(--sidebar-width);
                width: calc(100% - var(--sidebar-width));
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: var(--sidebar-width);
                background: var(--secondary-gradient);
                padding: 1.5rem 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                border-right: 1px solid rgba(255, 255, 255, 0.1);
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease-in-out;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                width: 100%;
            }

            .header .sidebar-toggle-btn {
                display: flex;
            }
        }

        .sidebar-top {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .sidebar-bottom {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding-bottom: 1rem;
        }

        .sidebar-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            font-size: 24px;
        }

        .sidebar-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .notification-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 10px;
            height: 10px;
            background: var(--accent-color);
            border-radius: 50%;
            border: 2px solid #000000;
        }
          /* ===================================== */
        /*            Main Content Area            */
        /* ===================================== */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            transition: margin-left 0.3s ease-in-out;
        }
          /* ===================================== */
        /*               Header                   */
        /* ===================================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 2rem;
            background: var(--secondary-gradient);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header .sidebar-toggle-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 24px;
            margin-right: 1rem;
            display: none;
        }

        @media (max-width: 768px) {
            .header .sidebar-toggle-btn {
                display: flex;
            }
        }

        .model-selector h2 {
            font-size: 1.25rem;
            font-weight: 600;
            transition: color 0.3s ease, background-clip 0.3s ease;
            text-fill-color: transparent;
            -webkit-background-clip: text;
            color: var(--text-primary);
        }

        .model-selector h2.voice-active {
           background-image: linear-gradient(to right, #76B900, #000000, #76B900);
            background-size: 200% 100%;
            animation: wave-text 3s linear infinite;
        }

        @keyframes wave-text {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

        .try-advanced {
            padding: 0.75rem 1.25rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .try-advanced:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-1px);
        }
         /* ===================================== */
        /*            Chat Container             */
        /* ===================================== */
        .chat-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 0;
            scroll-behavior: smooth;
            background: #000;
        }

        @media (max-width: 768px) {
            .chat-wrapper {
                padding-top: 1rem;
                padding-bottom: 1rem;
            }
        }

        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
             background: #000;
        }

        @media (max-width: 768px) {
            .chat-container {
                padding: 0 1rem;
            }
        }
         /* ===================================== */
        /*               Messages                 */
        /* ===================================== */
        .message {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 2rem;
            padding: 1.25rem;
            border-radius: 16px;
             background: #242424;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            max-width: 80%;
        }
        .message {
            margin-left: 0;
            margin-right: auto;
        }
        .message.user-message {
            flex-direction: row-reverse;
            margin-left: auto;
            margin-right: 0;
            background: rgba(0, 0, 0, 0.5);
            max-width: fit-content;
        }
        .message.ai-message {
            background: #242424;
        }
        .message.user-message .avatar {
            margin-left: 1rem;
            margin-right: 0;
        }
          .message:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-1px);
        }
            .avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
    .loading-message .avatar {
        width: 32px;
        height: 32px;
        font-size: 1rem;
    }
        .message-content {
            flex: 1;
            line-height: 1.5;
            font-size: 1.1rem;
            display: flex;
            flex-direction: column;
            word-break: break-word;
        }
        .ai-message .message-content ol {
             padding-left: 20px;
        }
        .ai-message .message-content li {
             margin-left: 10px;
            padding-left: 5px;
        }
             /* ===================================== */
        /*           Loading Animation           */
        /* ===================================== */
        .loading-indicator {
            display: flex;
            flex-direction: column;
            gap: 13px;
            width: 100%;
        }
        .loading-line {
            height: 14px;
            background: linear-gradient(to right, #333, var(--text-secondary));
            border-radius: 7px;
            overflow: hidden;
            transform-origin: left center;
            animation-fill-mode: forwards;
        }

        .loading-line::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, var(--text-secondary), #444, var(--text-secondary));
            background-size: 200% 100%;
            animation: shimmer 2s linear infinite;
        }
        .loading-line:nth-child(1) {
            width: 30%;
            animation: appear-line 0.8s forwards;
        }
        .loading-line:nth-child(1)::before {
            animation-duration: 2.5s;
        }
        .loading-line:nth-child(2) {
            width: 100%;
            animation: appear-line 1.1s 0.3s forwards;
        }
        .loading-line:nth-child(2)::before {
            animation-duration: 1.8s;
        }
        .loading-line:nth-child(3) {
            width: 80%;
            animation: appear-line 0.75s 0.1s forwards;
        }
        .loading-line:nth-child(3)::before {
            animation-duration: 3s;
        }
         .loading-line:nth-child(4) {
            width: 40%;
            animation: appear-line 1.1s 0.4s forwards;
        }
        .loading-line:nth-child(4)::before {
            animation-duration: 1.6s;
        }
         @keyframes appear-line {
            0% {
                transform: scaleX(0);
            }
            100% {
                transform: scaleX(1);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 100% 0;
            }
            100% {
                background-position: -100% 0;
            }
        }
        /* ===================================== */
        /*               Input Area              */
        /* ===================================== */
         .input-container {
            bottom: 0;
            left: 0;
            right: 0;
            padding: 2rem;
            background: #0a0a0a;
            backdrop-filter: blur(20px);
             border-top: 1px solid rgba(255, 255, 255, 0.1);
             transition: transform 0.3s ease-in-out; /* Add transition for smooth movement */
        }

        @media (min-width: 769px) {
            .input-container {
                left: var(--sidebar-width);
                transform: translateY(0); /* Reset transform on desktop */
            }
        }

        @media (max-width: 768px) {
            .input-container {
                padding: 1rem;
                position: fixed; /* Fix input container to the bottom on mobile */
                z-index: 200; /* Ensure it's above the chat content */
                transform: translateY(0); /* Initial position on mobile */
            }

            .input-container.input-focused {
                transform: translateY(-30vh); /* Adjust as needed to raise above keyboard */
            }
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1.1rem;
            line-height: 1.5;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            max-height: 200px;
            min-height: 60px;
        }
        .chat-input:focus {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08);
        }
        .send-button {
            width: var(--voice-button-size);
            height: var(--voice-button-size);
            border-radius: 16px;
            background: var(--accent-color);
            border: none;
            color: black;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            position: relative;
            margin-bottom: 0;
        }

        .send-button:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
        }

        .send-button svg {
            width: 24px;
            height: 24px;
            stroke: black;
            transform: rotate(45deg);
        }

        /* ===================================== */
        /*            Voice Button               */
        /* ===================================== */
        .voice-button {
            width: var(--voice-button-size);
            height: var(--voice-button-size);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 24px;
            flex-shrink: 0;
            margin-bottom: 0;
            outline: none;
        }

        .voice-button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .voice-button.active {
            background: var(--accent-color);
            color: black;
            box-shadow: 0 0 0 4px rgba(var(--accent-color-rgb, 118, 185, 0), 0.4);
        }

        .voice-button.active:hover {
            background: var(--hover-color);
        }

        .voice-button svg {
            width: 24px;
            height: 24px;
             stroke: currentColor;
        }

        @keyframes pulse-mic {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 0.8;
            }
        }

        .voice-button.listening {
            animation: pulse-mic 1.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        /* ===================================== */
        /*        Voice Mode Indicator         */
        /* ===================================== */
        .voice-mode-indicator {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background-image: linear-gradient(to right, #76B900, #000000, #76B900);
            background-size: 200% 100%;
            border-radius: 0 0 10px 10px;
            pointer-events: none;
            opacity: 0;
            z-index: 10;
            animation: wave-border 2s linear infinite;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }

        .voice-mode-indicator.active {
            opacity: 1;
        }

        @keyframes wave-border {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 200% 0;
            }
        }

          /* ===================================== */
        /*             Scrollbar Styling         */
        /* ===================================== */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        /* ===================================== */
        /*         Mobile Responsiveness         */
        /* ===================================== */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 60px;
                --voice-button-size: 50px;
            }

            .header {
                padding: 1rem;
            }

            .chat-wrapper {
                padding-top: 1rem;
                padding-bottom: 5rem; /* Adjusted padding to account for fixed input */
                overflow-y: auto; /* Ensure scrolling within chat area */
                height: calc(100vh - 56px - 76px); /* Calculate chat area height (header - input container) */
            }

            .input-container {
                padding: 1rem;
            }

            .sidebar-btn {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
           .message {
                flex-direction: row;
                align-items: flex-start;
                max-width: 90%;
                padding: 1rem;
                margin-bottom: 1.5rem;
            }
            .message.user-message {
                flex-direction: row-reverse;
                align-items: flex-start;
                margin-left: auto;
                margin-right: 1rem;
                max-width: 85%;
            }
            .avatar {
                margin-bottom: 0;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .message.user-message .avatar {
                margin-bottom: 0;
                margin-left: 0;
                margin-right: 0;
            }
            .message-content {
                width: auto;
                font-size: 1rem;
                line-height: 1.4;
            }

            .voice-button {
                font-size: 20px;
            }
             .send-button {
                width: var(--voice-button-size);
                height: var(--voice-button-size);
            }
            .thinking-button {
                padding: 0.75rem 1rem;
                height: auto;
                min-height: 60px;
                flex-direction: column;
                align-items: flex-start;
            }

            .thinking-button-top {
                margin-bottom: 0.5rem;
                align-items: flex-start;
            }

            .thinking-button-title {
                font-size: 1rem;
                margin-right: 0;
            }

            .thinking-button-dots {
                justify-content: flex-start;
            }

            .thinking-button-right {
                position: static;
                transform: none;
                margin-top: 0.5rem;
            }

            .thinking-expand-text {
                font-size: 0.8rem;
                left: 1rem;
                bottom: 0.5rem;
            }

            .thinking-process {
                font-size: 0.9rem;
                padding: 1rem;
            }
             .thinking-container.collapsed {
                height: auto;
            }
        }
        /* ===================================== */
        /*         Thinking Button Styling       */
        /* ===================================== */
         .thinking-container {
            margin-bottom: 1rem;
            overflow: hidden;
            transition: height var(--thinking-transition-duration) ease-in-out;
        }

        .thinking-container.collapsed {
            height: var(--thinking-button-height);
        }

        .thinking-container.expanded {
            height: auto;
        }

        .thinking-button {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 1rem 2rem;
             background: linear-gradient(135deg, #000000, var(--accent-color));
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            text-align: left;
            position: relative;
            height: var(--thinking-button-height);
            overflow: hidden;
            will-change: transform;
        }

        .thinking-button:hover {
            background: linear-gradient(135deg, #1a1a1a, var(--hover-color));
        }

        .thinking-button:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
        .thinking-button-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

       .thinking-button-title {
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-right: 0.75rem;
            line-height: 1.1;
            background-image: linear-gradient(to right, #ffffff, #76B900, #ffffff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-right: 0.1em;
            padding-bottom: 0.05em;
             will-change: font-size, background-position;
        }
    @media (max-width: 768px) {
            .thinking-button-title {
                transition: background-position 1.5s linear;
            }
        }

        .thinking-button:hover .thinking-button-title {
             background-position: 200% 0;
        }

         .thinking-button-dots {
            display: flex;
            gap: 0.4rem;
            line-height: 1.1;
        }
        .thinking-button-dot {
             width: 10px;
            height: 10px;
             border-radius: 50%;
             background-color: #fff;
             border: 2px solid black;
             animation: pulse-dot 1.5s infinite cubic-bezier(0.4, 0, 0.6, 1);
             will-change: transform, opacity;
        }
        .thinking-button-dot:nth-child(2) {
            animation-delay: 0.4s;
        }
        .thinking-button-dot:nth-child(3) {
            animation-delay: 0.8s;
        }

        @keyframes pulse-dot {
            0%, 100% {
                transform: scale(0.9);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .thinking-button-right {
            position: absolute;
            top: 50%;
            right: 2rem;
           transform: translateY(-50%);
           transition: transform var(--thinking-transition-duration) ease-in-out;
           will-change: transform;
        }

        .thinking-button-arrow {
            font-size: 1rem;
            color: var(--text-secondary);
             transition: transform var(--thinking-transition-duration) ease-in-out;
             transform: translateY(1px);
        }

        .thinking-button-arrow.open {
            transform: rotate(180deg) translateY(1px);
        }

       .thinking-expand-text {
          font-size: 0.9rem;
         color: var(--text-secondary);
         position: absolute;
           left: 2rem;
            bottom: 1rem;
           transition: color var(--thinking-transition-duration) ease-in-out, left var(--thinking-transition-duration) ease-in-out, bottom var(--thinking-transition-duration) ease-in-out;
           will-change: color, left, bottom;
        }

        .thinking-container.expanded .thinking-expand-text {
        }
        .thinking-process {
            margin-top: 0.5rem;
            padding: var(--thinking-button-expanded-padding);
            background-color: var(--thinking-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-secondary);
            white-space: pre-wrap;
            overflow-x: auto;
            opacity: 0;
            transform: translateY(-5px);
            transition: opacity var(--thinking-transition-duration) ease-in-out, transform var(--thinking-transition-duration) ease-out, padding var(--thinking-transition-duration) ease-in-out;
            will-change: opacity, transform, padding;
        }

        .thinking-container.expanded .thinking-process {
            opacity: 1;
            transform: translateY(0);
        }
         .thinking-container.collapsed .thinking-process {
            padding: 0 var(--thinking-button-expanded-padding);
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
             margin-top: 0;
        }

/* Style the tooltip text */
.tooltip-text {
    visibility: hidden;
    width: auto;
    min-width: 100px;
    max-width: 200px;
    background-color: #333;
    color: #fff;
    font-size: 14px;
    text-align: center;
    border-radius: 20px;
    padding: 10px;
    position: absolute;
    top: 50%;
    transform: translateY(-50%) translateX(20px);
    opacity: 0;
     transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    z-index: 1;
    padding: 8px 12px;
    line-height: 1.5;
    left: 110%;
}

/* Tooltip Arrow */
.tooltip-text::after {
    content: "";
    position: absolute;

function displayUserMessage(content) {

    messageDiv.innerHTML = `

function displayLoadingAnimation() {

    loadingDiv.innerHTML = `

function removeLoadingAnimation() {
    const loadingMessage = chatContainer.querySelector('.loading-message');

}

function formatThoughtProcess(thoughtProcess) {
    thoughtProcess = thoughtProcess
        .replace("Analyze the user's message and describe your understanding of it.", "Analyzing the user's message")
        .replace("Assistant's Internal Thought Process:", "Internal Thinking:")
        .replace("Assistant's Reply:", "Possible response to the user's prompt:");
    let sections = thoughtProcess.split(/(?=User message:|Internal Thinking:|Possible response to the user's prompt:)/g);
    const userMessageSections = sections.filter(section => section.trim().startsWith("User message:"));
    if (userMessageSections.length > 1) {
        sections = sections.filter(section => {
            if (section.trim().startsWith("User message:")) {
                return section === userMessageSections[0];
            }
            return true;
        });
    }
    return sections.map(section => section.trim()).join('\n\n');
}

function createThinkingComponent(formattedThoughts) {
    const container = document.createElement('div');
    container.className = 'thinking-container collapsed';
    const button = document.createElement('button');
    button.className = 'thinking-button';
    button.innerHTML = `
        <div class="thinking-button-top">
            <span class="thinking-button-title">Thoughts</span>
            <div class="thinking-button-dots">
                <span class="thinking-button-dot"></span>
                <span class="thinking-button-dot"></span>
                <span class="thinking-button-dot"></span>
            </div>
        </div>
        <div class="thinking-button-right">
            <i class="thinking-button-arrow"></i>
        </div>
        <div class="thinking-expand-text">Click to view model thoughts</div>
    `;
    const processDiv = document.createElement('div');
    processDiv.className = 'thinking-process';
    processDiv.textContent = formattedThoughts;
    button.addEventListener('click', () => {
        container.classList.toggle('collapsed');
        container.classList.toggle('expanded');
        button.querySelector('.thinking-button-arrow').classList.toggle('open');
        const expandText = button.querySelector('.thinking-expand-text');
        expandText.textContent = container.classList.contains('expanded')
            ? "A.I Model's thoughts are experimental"
            : "Click to view model thoughts";
    });
    container.appendChild(button);
    container.appendChild(processDiv);
    return container;
}

function displayAiMessage(fullResponse) {
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message ai-message';
    const messageContentDiv = document.createElement('div');
    messageContentDiv.className = 'message-content';
    const parts = fullResponse.split('MODEL_OUTPUT-');
    let output = '';

    if (parts.length > 0) {
        const thinkingPart = parts[0].replace('THINKING-', '').trim();
        if (thinkingPart) {
            const formattedThoughts = formatThoughtProcess(thinkingPart);
            const thinkingComponent = createThinkingComponent(formattedThoughts);
            messageContentDiv.appendChild(thinkingComponent);
        }
    }

    if (parts.length > 1) {
        output = parts[1].trim();
        if (output) {
            const outputDiv = document.createElement('div');
            const lines = output.trim().split('\n');
            let currentList = null;
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                const numberedMatch = line.match(/^(\d+)\.\s+(.*)/);
                if (numberedMatch) {
                    if (!currentList) {
                        currentList = document.createElement('ol');
                        outputDiv.appendChild(currentList);
                    }
                    const listItem = document.createElement('li');
                    listItem.textContent = numberedMatch[2];
                    currentList.appendChild(listItem);
                } else {
                    currentList = null;
                    const paragraph = document.createElement('p');
                    paragraph.textContent = line;
                    outputDiv.appendChild(paragraph);
                }
            });
            messageContentDiv.appendChild(outputDiv);
        }
    }

    messageDiv.innerHTML = `<div class="avatar">C</div>`;
    messageDiv.appendChild(messageContentDiv);
    chatContainer.appendChild(messageDiv);
    scrollToBottom();
}

// Backend Communication
async function sendToBackend(message) {
    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        return data.response;
    } catch (error) {
        console.error('Error:', error);
        throw new Error('Failed to communicate with AI');
    }
}

// Main Message Handler
async function sendMessage() {
    const message = textarea.value.trim();
    if (!message) return;
    try {
        setInputState(true);
        displayUserMessage(message);
        chatHistory.push({ sender: 'user', content: message });
        textarea.value = '';
        autoResize(textarea);
        displayLoadingAnimation();
        const aiResponse = await sendToBackend(message);
        removeLoadingAnimation();
        displayAiMessage(aiResponse);
        chatHistory.push({ sender: 'assistant', content: aiResponse });
        // Automatically restart voice mode after AI responds ONLY if it was manually enabled
        if (voiceModeManuallyEnabled && SpeechRecognition) {
            clearTimeout(autoRestartVoiceTimeout);
            autoRestartVoiceTimeout = setTimeout(() => {
                if (!isVoiceActive) {
                    recognition.start();
                }
            }, AUTO_RESTART_DELAY);
        }
    } catch (error) {
        removeLoadingAnimation();
        displayAiMessage("Sorry, I encountered an error communicating with the AI.");
    } finally {
        setInputState(false);
        textarea.focus();
    }
}

// Voice Mode Functionality
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleVoiceActiveClass(isActive) {
    headerTitle.classList.toggle('voice-active', isActive);
}

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;

    recognition.onstart = () => {
        isVoiceActive = true;
        voiceButton.classList.add('active', 'listening');
        voiceModeIndicator.classList.add('active');
        toggleVoiceActiveClass(true);
        textarea.placeholder = 'Listening...';
    };

    recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }
        textarea.value = finalTranscript || interimTranscript;
        autoResize(textarea);
    };

    recognition.onend = () => {
        isVoiceActive = false;
        voiceButton.classList.remove('active', 'listening');
        voiceModeIndicator.classList.remove('active');
        toggleVoiceActiveClass(false);
        textarea.placeholder = 'Message GEN-T...';
        if (textarea.value.trim() && voiceModeManuallyEnabled) {
            sendMessage();
        }
    };

    recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        isVoiceActive = false;
        voiceButton.classList.remove('active', 'listening');
        voiceModeIndicator.classList.remove('active');
        toggleVoiceActiveClass(false);
        textarea.placeholder = 'Message GEN-T... (Voice error)';
    };
} else {
    voiceButton.style.display = 'none';
    console.warn('Speech Recognition API is not supported in this browser.');
}

voiceButton.addEventListener('click', () => {
    if (SpeechRecognition) {
        voiceModeManuallyEnabled = !voiceModeManuallyEnabled; // Toggle the flag
        if (voiceModeManuallyEnabled) {
            recognition.start();
        } else {
            recognition.stop();
            clearTimeout(autoRestartVoiceTimeout); // Clear auto-restart if manually stopped
        }
    } else {
        alert('Voice mode is not supported in your browser.');
    }
});
