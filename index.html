<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEN-T V2.0</title>
    <link rel="stylesheet" href="style.css">
    <style>
</head>
<body>
<nav class="sidebar">
    <!-- Sidebar Top Section -->
    <div class="sidebar-top">
        <!-- Menu Button -->
        <button class="sidebar-btn" id="main-sidebar-toggle">☰</button>

        <!-- New Chat Button with Tooltip -->
        <button class="sidebar-btn tooltip-target" id="new-chat-btn">
            +
            <span class="tooltip-text">New Chat</span>
        </button>
    </div>

    <!-- Sidebar Bottom Section -->
    <div class="sidebar-bottom">
        <!-- Help & Feedback Button with Notification Dot and Tooltip -->
        <button class="sidebar-btn tooltip-target" id="help-feedback-btn">
            ?
            <span class="notification-dot"></span>
            <span class="tooltip-text">What's New?</span>
        </button>

        <!-- Retry Output Button with Tooltip -->
        <button class="sidebar-btn tooltip-target">
            ↻
            <span class="tooltip-text">Retry Output</span>
        </button>

        <!-- Profile & Settings Button with Tooltip -->
        <button class="sidebar-btn tooltip-target">
            ⚙️
                        <span class="tooltip-text">Profile & Settings</span>
        </button>
    </div>
</nav>
    <main class="main-content">
        <header class="header">
            <button class="sidebar-toggle-btn">☰</button>
            <div class="model-selector">
                <h2 id="header-title">GEN-T V2.0</h2>
            </div>
             <button class="try-advanced" style="background-color: #76B900; border-color: rgba(255, 255, 255, 0.2);">
                ✨ Genius
            </button>
        </header>
        <div class="chat-wrapper">
            <div class="chat-container" id="chat-container">
                <div class="message ai-message">
                    <div class="avatar">S</div>
                    <div class="message-content">
                        Hi there! How can I help you today?
                    </div>
                </div>
            </div>
        </div>
        <div class="input-container">
            <div class="input-wrapper">
                <button class="voice-button" id="voice-button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2c0 3.5-2.5 6.5-6 7v0"></path>
                        <path d="M5 10v2c0 3.5 2.5 6.5 6 7v0"></path>
                    </svg>
                </button>
                <textarea class="chat-input" placeholder="Message GEN-T..." rows="1"></textarea>
                <button class="send-button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="voice-mode-indicator" id="voice-mode-indicator"></div>
        <div id="cardContainer">
        <div class="card-content">
            <button class="close-btn" id="closeCardBtn">×</button>
            <div class="top-bar">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAABGdBTUEAALGPC/xhBQAAADhlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAAAAqADAAQAAAABAAAAAgAAAAA0hc+jAAAAEklEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Google Icon">
                <div class="title">What's New?</div>
            </div>
            <div class="description">GEN-T has gotten a lot smarter than you think. It now has a lot more features than you can imagine.</div>
            <div class="navigation">
                <button class="nav-button" id="prevBtn"><</button>
                <div class="pagination">
                    <div class="dot active" data-index="0"></div>
                    <div class="dot" data-index="1"></div>
                    <div class="dot" data-index="2"></div>
                    <div class="dot" data-index="3"></div>
                    <div class="dot" data-index="4"></div>
                </div>
                <button class="nav-button" id="nextBtn">></button>
            </div>
        </div>
    </div>

    <div id="overlay"></div>

<script>
// DOM Elements
const sidebar = document.querySelector('.sidebar');
const sidebarToggleBtn = document.querySelector('.sidebar-toggle-btn');
const mainContent = document.querySelector('.main-content');
const mainContentWrapper = document.querySelector('.main-content-wrapper');
const textarea = document.querySelector('.chat-input');
const sendButton = document.querySelector('.send-button');
const chatContainer = document.querySelector('#chat-container');
const voiceButton = document.getElementById('voice-button');
const voiceModeIndicator = document.getElementById('voice-mode-indicator');
const headerTitle = document.getElementById('header-title');
const mainSidebarToggle = document.getElementById('main-sidebar-toggle');
const tooltipTargets = document.querySelectorAll('.tooltip-target');
let chatHistory = [];
let isVoiceActive = false;
let recognition = null;
// let silenceTimer; // REMOVE or COMMENT OUT
let autoRestartVoiceTimeout;
const SILENCE_DELAY = 1500; // 1.5 seconds of silence to trigger send
const AUTO_RESTART_DELAY = 3000; // 3 seconds before voice mode restarts
let voiceModeManuallyEnabled = false; // Track if voice mode was explicitly enabled
let tooltipsActive = false;

        // Card Elements
        const cardContainer = document.getElementById('cardContainer');
        const overlay = document.getElementById('overlay');
        const descriptionElement = document.querySelector('#cardContainer .description');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const closeCardBtn = document.getElementById('closeCardBtn');
        const dots = document.querySelectorAll('#cardContainer .pagination .dot');
    const helpFeedbackBtn = document.getElementById('help-feedback-btn'); // Get help and feedback button

const cardTexts = [
    "GEN-T has become more intelligent and capable than ever before, packed with features beyond what you could imagine.",
    "• Introducing GEN-T V2.0, our fastest and most intelligent model yet, designed to tackle tasks demanding advanced reasoning with ease.",
    "• GEN-T V2.0 employs a sophisticated chain-of-thought process, enabling the model to 'think' through questions before responding, ensuring highly accurate and well-reasoned answers.",
    "• GEN-T V2.0 now features Voice Mode, live web search, and a chain-of-thought process, all working seamlessly together while maintaining peak efficiency.",
    "GEN-T V2.0 is ready to tackle anything you throw its way. We hope you find this model both incredibly helpful and entertaining."
];

        let currentTextIndex = 0;

        function updateCardText() {
            descriptionElement.style.opacity = 0; // Fade out
            setTimeout(() => {
                descriptionElement.textContent = cardTexts[currentTextIndex];
                descriptionElement.style.opacity = 1; // Fade in
            }, 300); // Match the opacity transition time
            updatePagination();
        }

        function updatePagination() {
            dots.forEach((dot, index) => {
                if (index === currentTextIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
        }

/* Update the JavaScript functions */
function openCard() {
    cardContainer.style.display = 'block';
    // Force a reflow before adding the open class
    cardContainer.offsetHeight;
    cardContainer.classList.add('open');
    overlay.style.display = 'block';
    overlay.offsetHeight; // Force a reflow
    overlay.classList.add('show');
}

function closeCard() {
    cardContainer.classList.remove('open');
    overlay.classList.remove('show');

    // Wait for the transition to complete before hiding elements
    setTimeout(() => {
        if (!cardContainer.classList.contains('open')) {
            cardContainer.style.display = 'none';
            overlay.style.display = 'none';
        }
    }, 600); // Match the transition duration (0.6s = 600ms)
}

// Update event listeners
helpFeedbackBtn.addEventListener('click', openCard);
closeCardBtn.addEventListener('click', closeCard);
overlay.addEventListener('click', closeCard);

// Add escape key handler
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && cardContainer.classList.contains('open')) {
        closeCard();
    }
});

// Helper Functions
function autoResize(element) {
    element.style.height = 'auto';
    const newHeight = Math.min(element.scrollHeight, 200);
    element.style.height = newHeight + 'px';
}

function escapeHTML(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function scrollToBottom() {
   const chatWrapper = document.querySelector('.chat-wrapper');
   const lastMessage = chatContainer.lastElementChild;
   if (lastMessage) {
        lastMessage.scrollIntoView({ behavior: 'smooth', block: 'end' });
   }
}

function setInputState(disabled) {
    textarea.disabled = disabled;
    sendButton.disabled = disabled;
    voiceButton.disabled = disabled;
}

// Message Display Functions
function displayUserMessage(content) {
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message user-message';
    messageDiv.innerHTML = `
        <div class="avatar">U</div>
        <div class="message-content">${escapeHTML(content)}</div>
    `;
    chatContainer.appendChild(messageDiv);
    scrollToBottom();
}

function displayLoadingAnimation() {
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'message ai-message loading-message';
    loadingDiv.innerHTML = `
        <div class="avatar">C</div>
        <div class="message-content">
            <div class="loading-indicator">
                <div class="loading-line"></div>
                <div class="loading-line"></div>
                <div class="loading-line"></div>
                <div class="loading-line"></div>
            </div>
        </div>
    `;
    chatContainer.appendChild(loadingDiv);
    scrollToBottom();
}

function removeLoadingAnimation() {
    const loadingMessage = chatContainer.querySelector('.loading-message');
    if (loadingMessage) {
        loadingMessage.remove();
    }
}

function formatThoughtProcess(thoughtProcess) {
    thoughtProcess = thoughtProcess
        .replace("Analyze the user's message and describe your understanding of it.", "Analyzing the user's message")
        .replace("Assistant's Internal Thought Process:", "Internal Thinking:")
        .replace("Assistant's Reply:", "Possible response to the user's prompt:");
    let sections = thoughtProcess.split(/(?=User message:|Internal Thinking:|Possible response to the user's prompt:)/g);
    const userMessageSections = sections.filter(section => section.trim().startsWith("User message:"));
    if (userMessageSections.length > 1) {
        sections = sections.filter(section => {
            if (section.trim().startsWith("User message:")) {
                return section === userMessageSections[0];
            }
            return true;
        });
    }
    return sections.map(section => section.trim()).join('\n\n');
}

function createThinkingComponent(formattedThoughts) {
    const container = document.createElement('div');
    container.className = 'thinking-container collapsed';
    const button = document.createElement('button');
    button.className = 'thinking-button';
    button.innerHTML = `
        <div class="thinking-button-top">
            <span class="thinking-button-title">Thoughts</span>
            <div class="thinking-button-dots">
                <span class="thinking-button-dot"></span>
                <span class="thinking-button-dot"></span>
                <span class="thinking-button-dot"></span>
            </div>
        </div>
        <div class="thinking-button-right">
            <i class="thinking-button-arrow"></i>
        </div>
        <div class="thinking-expand-text">Click to view model thoughts</div>
    `;
    const processDiv = document.createElement('div');
    processDiv.className = 'thinking-process';
    processDiv.textContent = formattedThoughts;
    button.addEventListener('click', () => {
        container.classList.toggle('collapsed');
        container.classList.toggle('expanded');
        button.querySelector('.thinking-button-arrow').classList.toggle('open');
        const expandText = button.querySelector('.thinking-expand-text');
        expandText.textContent = container.classList.contains('expanded')
            ? "A.I Model's thoughts are experimental"
            : "Click to view model thoughts";
    });
    container.appendChild(button);
    container.appendChild(processDiv);
    return container;
}

function displayAiMessage(fullResponse) {
    const messageDiv = document.createElement('div');
    messageDiv.className = 'message ai-message';
    const messageContentDiv = document.createElement('div');
    messageContentDiv.className = 'message-content';
    const parts = fullResponse.split('MODEL_OUTPUT-');
    let output = '';

    if (parts.length > 0) {
        const thinkingPart = parts[0].replace('THINKING-', '').trim();
        if (thinkingPart) {
            const formattedThoughts = formatThoughtProcess(thinkingPart);
            const thinkingComponent = createThinkingComponent(formattedThoughts);
            messageContentDiv.appendChild(thinkingComponent);
        }
    }

    if (parts.length > 1) {
        output = parts[1].trim();
        if (output) {
            const outputDiv = document.createElement('div');
            const lines = output.trim().split('\n');
            let currentList = null;
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;
                const numberedMatch = line.match(/^(\d+)\.\s+(.*)/);
                if (numberedMatch) {
                    if (!currentList) {
                        currentList = document.createElement('ol');
                        outputDiv.appendChild(currentList);
                    }
                    const listItem = document.createElement('li');
                    listItem.textContent = numberedMatch[2];
                    currentList.appendChild(listItem);
                } else {
                    currentList = null;
                    const paragraph = document.createElement('p');
                    paragraph.textContent = line;
                    outputDiv.appendChild(paragraph);
                }
            });
            messageContentDiv.appendChild(outputDiv);
        }
    }

    messageDiv.innerHTML = `<div class="avatar">C</div>`;
    messageDiv.appendChild(messageContentDiv);
    chatContainer.appendChild(messageDiv);
    scrollToBottom();
}

// Backend Communication
async function sendToBackend(message) {
    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();
        return data.response;
    } catch (error) {
        console.error('Error:', error);
        throw new Error('Failed to communicate with AI');
    }
}

// Main Message Handler
async function sendMessage() {
    const message = textarea.value.trim();
    if (!message) return;
    try {
        setInputState(true);
        displayUserMessage(message);
        chatHistory.push({ sender: 'user', content: message });
        textarea.value = '';
        autoResize(textarea);
        displayLoadingAnimation();
        const aiResponse = await sendToBackend(message);
        removeLoadingAnimation();
        displayAiMessage(aiResponse);
        chatHistory.push({ sender: 'assistant', content: aiResponse });
        // Automatically restart voice mode after AI responds ONLY if it was manually enabled
        if (voiceModeManuallyEnabled && SpeechRecognition) {
            clearTimeout(autoRestartVoiceTimeout);
            autoRestartVoiceTimeout = setTimeout(() => {
                if (!isVoiceActive) {
                    recognition.start();
                }
            }, AUTO_RESTART_DELAY);
        }
    } catch (error) {
        removeLoadingAnimation();
        displayAiMessage("Sorry, I encountered an error communicating with the AI.");
    } finally {
        setInputState(false);
        textarea.focus();
    }
}

// Voice Mode Functionality
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleVoiceActiveClass(isActive) {
    headerTitle.classList.toggle('voice-active', isActive);
}

if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = true;

    recognition.onstart = () => {
        isVoiceActive = true;
        voiceButton.classList.add('active', 'listening');
        voiceModeIndicator.classList.add('active');
        toggleVoiceActiveClass(true);
        textarea.placeholder = 'Listening...';
    };

    recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }
        textarea.value = finalTranscript || interimTranscript;
        autoResize(textarea);
    };

    recognition.onend = () => {
        isVoiceActive = false;
        voiceButton.classList.remove('active', 'listening');
        voiceModeIndicator.classList.remove('active');
        toggleVoiceActiveClass(false);
        textarea.placeholder = 'Message GEN-T...';
        if (textarea.value.trim() && voiceModeManuallyEnabled) {
            sendMessage();
        }
    };

    recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        isVoiceActive = false;
        voiceButton.classList.remove('active', 'listening');
        voiceModeIndicator.classList.remove('active');
        toggleVoiceActiveClass(false);
        textarea.placeholder = 'Message GEN-T... (Voice error)';
    };
} else {
    voiceButton.style.display = 'none';
    console.warn('Speech Recognition API is not supported in this browser.');
}

voiceButton.addEventListener('click', () => {
    if (SpeechRecognition) {
        voiceModeManuallyEnabled = !voiceModeManuallyEnabled; // Toggle the flag
        if (voiceModeManuallyEnabled) {
            recognition.start();
        } else {
            recognition.stop();
            clearTimeout(autoRestartVoiceTimeout); // Clear auto-restart if manually stopped
        }
    } else {
        alert('Voice mode is not supported in your browser.');
    }
});

// Event Listeners
textarea.addEventListener('input', () => autoResize(textarea));
textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});
sendButton.addEventListener('click', sendMessage);

// Initialize
autoResize(textarea);

// New Chat Functionality
const newChatButton = document.getElementById('new-chat-btn');
newChatButton.addEventListener('click', startNewChat);

async function startNewChat() {
    chatContainer.innerHTML = `
        <div class="message ai-message">
            <div class="avatar">S</div>
            <div class="message-content">
                Hi there! How can I help you today?
            </div>
        </div>
    `;
    try {
        const response = await fetch('/api/new_chat', {
            method: 'POST',
        });
        if (!response.ok) {
            console.error('Failed to start new chat on the backend.');
        }
    } catch (error) {
        console.error('Error starting new chat:', error);
    }
}

// Sidebar Toggle Functionality
sidebarToggleBtn.addEventListener('click', () => {
    sidebar.classList.toggle('open');
});

mainSidebarToggle.addEventListener('click', () => {
  if (window.innerWidth > 768) {
    tooltipsActive = !tooltipsActive;
    tooltipTargets.forEach((target, index) => {
      const tooltip = target.querySelector('.tooltip-text');
      if (tooltipsActive) {
        setTimeout(() => {
            tooltip.classList.add('tooltip-active');
        }, index * 50); // Stagger animation with a delay for each tooltip
      } else {
        // Add fade-out class and remove it after animation
        tooltip.classList.add('tooltip-fade-out');
        setTimeout(() => {
          tooltip.classList.remove('tooltip-active', 'tooltip-fade-out');
        }, 300); // Match the transition duration
      }
    });
  } else {
    sidebar.classList.toggle('open');
  }
});

// Add event listener for the secondary sidebar button
const sidebarButtonInside = document.querySelector('.sidebar .sidebar-top .sidebar-btn');
if (sidebarButtonInside) {
    sidebarButtonInside.addEventListener('click', () => {
        sidebar.classList.remove('open');
    });
}
       // Event listener for opening and closing the card
        helpFeedbackBtn.addEventListener('click', openCard);

        closeCardBtn.addEventListener('click', closeCard);
         overlay.addEventListener('click', closeCard);

        prevBtn.addEventListener('click', () => {
            currentTextIndex = (currentTextIndex - 1 + cardTexts.length) % cardTexts.length;
            updateCardText();
        });

        nextBtn.addEventListener('click', () => {
            currentTextIndex = (currentTextIndex + 1) % cardTexts.length;
            updateCardText();
        });

        document.addEventListener('keydown', function(event) {
            if (cardContainer.classList.contains('open')) {
                if (event.key === 'ArrowLeft') {
                    currentTextIndex = (currentTextIndex - 1 + cardTexts.length) % cardTexts.length;
                    updateCardText();
                } else if (event.key === 'ArrowRight') {
                    currentTextIndex = (currentTextIndex + 1) % cardTexts.length;
                    updateCardText();
                }
            }
        });

        updateCardText(); // Initialize the card text
// Get all sidebar buttons EXCEPT the main toggle
const sidebarButtons = document.querySelectorAll('.sidebar .sidebar-btn:not(#main-sidebar-toggle)');

// Add click event listener to each sidebar button
sidebarButtons.forEach(button => {
    button.addEventListener('click', () => {
        if (sidebar.classList.contains('open')) {
           sidebar.classList.remove('open');
        }
    });
});

// Event listeners for the remaining sidebar buttons (replace with your desired functionality)
const heartButton = document.querySelector('.sidebar-bottom button:nth-child(1)');
const questionButton = document.querySelector('.sidebar-bottom button:nth-child(2)');
const refreshButton = document.querySelector('.sidebar-bottom button:nth-child(3)');
const settingsButton = document.querySelector('.sidebar-bottom button:nth-child(4)');

heartButton.addEventListener('click', () => {
    console.log('Heart button clicked');
    // Add your functionality for the heart button here
});

questionButton.addEventListener('click', () => {
    console.log('Question button clicked');
    // Add your functionality for the question button here
});

refreshButton.addEventListener('click', () => {
    console.log('Refresh button clicked');
    // Add your functionality for the refresh button here, potentially clearing the chat
    startNewChat(); // Example: clear chat on refresh
});

settingsButton.addEventListener('click', () => {
    console.log('Settings button clicked');
    // Add your functionality for the settings button here
});

  // Ensure card is closed initially
    cardContainer.style.display = 'none';

    </script>
</body>
